<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #1c2530; margin: 0; }
        .container { max-width: 750px; margin: 30px auto; padding: 0 16px; }
        .alert-danger { background: #f8d7da; color: #7a1f27; border: 1px solid #eec2c6; padding: 14px 18px; border-radius: 4px; font-weight: bold; margin-bottom: 20px; }
        .btn { display: inline-block; padding: 7px 16px; border: 1px solid #1a5276; border-radius: 4px;
            background: #2471a3; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #1a5276; }
    </style>
</head>
<body>
<div class="container">
    <div class="alert-danger" th:text="${errorMessage}">Something went wrong while processing your request. Please go back and try again.</div>
    <div>
        <a th:href="@{/}" class="btn">Back to list</a>
    </div>
</div>
</body>
</html>
