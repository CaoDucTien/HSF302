# EDIT 1: Change to your new project/exam name (Format: Class_StudentID_Project_PE)
spring.application.name=SE20A10_DE190608_SDM_PE

# Default web port and context path (DO NOT CHANGE)
server.port=8080
server.servlet.context-path=/

# MS SQL Server connection
# EDIT 2: Change databaseName to match your SQL Server database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SE20A10_DE190608_SDM_PE;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
# EDIT 3: Change if your SQL Server password is not 'sa'
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA configuration (DO NOT CHANGE)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true

# Thymeleaf configuration (DO NOT CHANGE)
spring.thymeleaf.cache=false